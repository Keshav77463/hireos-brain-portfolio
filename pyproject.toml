[project]
name = "hireos-brain"
version = "0.1.0"
description = "Evidence-backed recruiting analytics prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
